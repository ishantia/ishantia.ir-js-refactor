    <!-- Preconnect for asynchronous Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking asynchronous Font Loading -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Prevent theme & language flash before hydration -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("ishantia-theme");
          var root = document.documentElement;
          if (theme === "light") {
            root.classList.remove("dark");
            root.classList.add("light");
          } else {
            root.classList.remove("light");
            root.classList.add("dark");
          }
          var lang = localStorage.getItem("ishantia-lang");
          if (lang === "fa") {
            root.lang = "fa";
            root.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Single Page Apps for GitHub Pages
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (
          redirect &&
          redirect !==
            window.location.pathname +
              window.location.search +
              window.location.hash
        ) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

  </body>
